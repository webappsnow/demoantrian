<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Queue Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Tema Gelap: Latar hitam pekat, teks putih bersih */
        .dark body { background-color: #020617; color: #ffffff; }
        .dark .glass-card { background: #0f172a; border: 2px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        .dark .box-element { background: #1e293b; border-color: #475569; color: #ffffff; }
        .dark .btn-theme { background-color: #ffffff; color: #000000; }
        
        /* Tema Terang: Latar putih bersih, box putih bersih, teks hitam legam */
        .light body { background-color: #f1f5f9; color: #000000; }
        .light .glass-card { background: #ffffff; border: 2px solid #cbd5e1; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15); }
        .light .box-element { background: #ffffff; border-color: #cbd5e1; color: #000000; }
        .light .btn-theme { background-color: #000000; color: #ffffff; }

        .text-main { color: #000000; }
        .dark .text-main { color: #ffffff; }
        
        .text-muted { color: #334155; }
        .dark .text-muted { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex items-center justify-center transition-colors duration-300">
    
    <!-- Modern Custom Modal / Popup -->
    <div id="customModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="w-full max-w-sm glass-card rounded-3xl p-6 text-center border-2 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
            <div id="modalIconContainer" class="w-12 h-12 mx-auto rounded-2xl flex items-center justify-center box-element border-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <div>
                <h3 id="modalTitle" class="text-lg font-black text-main">Informasi</h3>
                <p id="modalMessage" class="text-xs sm:text-sm text-muted font-bold mt-2">Pesan informasi sistem.</p>
            </div>
            <button onclick="closeModal()" class="w-full btn-theme font-black py-3 rounded-xl text-sm hover:opacity-95 transition shadow-md cursor-pointer">
                OK, Mengerti
            </button>
        </div>
    </div>

    <div class="w-full max-w-sm sm:max-w-md glass-card rounded-[2.5rem] p-6 sm:p-8 relative overflow-hidden transition-all">
        
        <!-- Logo di Pojok Kiri Atas -->
        <img src="logo.png" alt="Logo" class="absolute top-5 left-5 w-11 h-11 rounded-xl shadow-sm border dark:border-slate-600 light:border-slate-300 object-cover z-20" onerror="this.style.display='none'">

        <!-- Tombol Ganti Tema di Pojok Kanan Atas -->
        <button onclick="toggleTheme()" class="absolute top-5 right-5 p-2.5 rounded-xl border-2 dark:border-slate-600 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 transition-all hover:scale-105 z-20 cursor-pointer shadow-sm" title="Ganti Tema">
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden dark:text-amber-400 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 dark:text-slate-200 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <!-- Nama Tempat, Alamat & Header -->
        <div class="text-center mb-6 pt-3">
            <h2 class="text-lg font-black text-main tracking-tight">Klinik Sehat Utama</h2>
            <p class="text-muted text-xs font-semibold mt-0.5">Jl. Raya Kesehatan No. 123, Jakarta</p>
            <h1 class="text-2xl font-black text-main mt-3">Antrian Digital</h1>
        </div>

        <!-- Jam & Tanggal -->
        <div class="mb-5 p-4 rounded-2xl box-element border-2 flex flex-col sm:flex-row justify-between items-center text-base sm:text-lg font-black shadow-inner gap-2 sm:gap-0">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="realDate" class="text-center sm:text-left">--/--/----</span>
            </div>
            <div class="flex items-center space-x-1.5 font-mono">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="realClock">00:00:00</span>
            </div>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-xs sm:text-sm font-black uppercase tracking-wider text-muted mb-1.5">Nama</label>
                    <input type="text" id="nama" required class="w-full px-4 py-4 rounded-xl border-2 box-element text-base font-extrabold outline-none transition" placeholder="">
                </div>
                <div>
                    <label class="flex items-center space-x-1.5 text-xs sm:text-sm font-black uppercase tracking-wider text-muted mb-1.5">
                        <span>No</span>
                        <svg class="w-4 h-4 text-emerald-500 fill-current shrink-0" viewBox="0 0 24 24">
                            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                        </svg>
                        <span class="font-normal opacity-90">(Opsional)</span>
                    </label>
                    <input type="tel" id="telepon" class="w-full px-4 py-4 rounded-xl border-2 box-element text-base font-extrabold outline-none transition" placeholder="">
                </div>
                <button type="submit" id="btnSubmit" class="w-full mt-2 btn-theme font-black py-4 rounded-xl text-base hover:opacity-95 transition shadow-md cursor-pointer">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-4">
            <div class="text-center p-6 rounded-3xl border-2 box-element shadow-sm">
                <p class="text-xs font-black uppercase tracking-widest text-muted">Nomor Antrian Anda</p>
                <h2 id="displayNo" class="text-6xl font-black text-main my-2">-</h2>
                <p id="displayName" class="text-main font-black text-base"></p>
            </div>
            
            <div class="flex justify-between items-center p-4 rounded-2xl border-2 box-element">
                <div class="text-left">
                    <p class="text-xs sm:text-sm font-black uppercase tracking-wider text-muted">Status / Sisa Antrian</p>
                    <p id="statusInfoText" class="text-xs sm:text-sm text-main font-extrabold">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-2xl sm:text-3xl font-black text-main">0</span>
                    <span id="unitOrang" class="text-xs sm:text-sm text-muted font-black ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Live Status -->
            <div class="box-element border-2 rounded-2xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3 px-1">
                    <p class="text-xs sm:text-sm font-black uppercase tracking-wider text-muted">Live Status Antrian</p>
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                </div>
                <div class="max-h-48 overflow-y-auto space-y-2.5 pr-1" id="liveQueueList">
                    <!-- List dirender secara otomatis -->
                </div>
            </div>

            <div class="flex items-center justify-center space-x-2 pt-3 border-t-2 dark:border-slate-700 light:border-slate-300 text-xs sm:text-sm font-bold text-muted text-center">
                <span>✓ Anda sudah terdaftar di dalam antrian.</span>
            </div>
        </div>
        
        <div class="text-center mt-6 text-xs font-black text-muted tracking-widest uppercase">
            Enterprise Queue Management
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;
        let modalCallback = null;

        // Fungsi Custom Modern Modal
        function showModal(title, message, callback = null) {
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalMessage").innerText = message;
            document.getElementById("customModal").classList.remove("hidden");
            modalCallback = callback;
        }

        function closeModal() {
            document.getElementById("customModal").classList.add("hidden");
            if (modalCallback) {
                modalCallback();
                modalCallback = null;
            }
        }

        function updateRealTimeClock() {
            const now = new Date();
            const optionsDate = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const dateEl = document.getElementById("realDate");
            const clockEl = document.getElementById("realClock");
            if (dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', optionsDate);
            if (clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
        }
        setInterval(updateRealTimeClock, 1000);
        updateRealTimeClock();

        function toggleTheme() {
            const html = document.documentElement;
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                html.classList.add("light");
                localStorage.setItem("theme", "light");
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
        }

        (function() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const html = document.documentElement;
            if (savedTheme === "light") {
                html.classList.remove("dark");
                html.classList.add("light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
            }
        })();

        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (savedTheme === "light") {
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }

            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                showModal("Perhatian", "Anda sudah terdaftar di dalam antrian!", () => {
                    location.reload();
                });
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                });
        });

        function appendInstantToList(qNo, qNama) {
            const listContainer = document.getElementById("liveQueueList");
            if (listContainer.innerHTML.includes("Belum ada antrian") || listContainer.innerHTML.trim() === "") {
                listContainer.innerHTML = "";
            }

            listContainer.innerHTML += `
                <div class="p-3 rounded-xl border-2 box-element flex justify-between items-center text-xs sm:text-sm shadow-sm">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="font-black text-main text-sm sm:text-base box-element px-2.5 py-1 rounded-lg border-2 shrink-0">${qNo}</span>
                        <span class="text-main font-extrabold truncate max-w-[110px] sm:max-w-[140px]">${qNama} <span class="font-black underline">(Anda)</span></span>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg text-[10px] sm:text-xs uppercase tracking-wider box-element text-main font-black border-2 shrink-0">Menunggu</span>
                </div>
            `;
            document.getElementById("displayWaiting").innerText = "0";
            document.getElementById("unitOrang").style.display = "inline";
        }

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list) return;

                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; 

                    if (data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs sm:text-sm text-muted text-center py-3 font-bold">Belum ada antrian</p>`;
                        return;
                    }

                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    const displayWaitingEl = document.getElementById("displayWaiting");
                    const unitOrangEl = document.getElementById("unitOrang");
                    const statusInfoTextEl = document.getElementById("statusInfoText");

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            localStorage.removeItem("my_queue_number");
                            localStorage.removeItem("my_queue_name");
                            showModal("Selesai", "Layanan telah selesai. Terima kasih!", () => {
                                location.reload();
                            });
                            return;
                        } else if (foundInList.status === "dipanggil") {
                            statusInfoTextEl.innerText = "Status Anda:";
                            displayWaitingEl.innerText = "GILIRAN ANDA!";
                            unitOrangEl.style.display = "none";
                        } else {
                            statusInfoTextEl.innerText = "Estimasi Real-time";
                            unitOrangEl.style.display = "inline";
                            if (myIndex !== -1) {
                                displayWaitingEl.innerText = myIndex;
                            } else {
                                displayWaitingEl.innerText = "0";
                            }
                        }
                    }

                    data.list.forEach(item => {
                        let badgeClass = "box-element text-main";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeClass = "box-element text-main";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeClass = "dark:bg-white dark:text-slate-900 light:bg-slate-900 light:text-white font-black animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeClass = "box-element text-muted opacity-80";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-slate-900 dark:border-white shadow-md" : "box-element";

                        listContainer.innerHTML += `
                            <div class="p-3 rounded-xl border-2 ${cardHighlight} flex justify-between items-center text-xs sm:text-sm transition-all shadow-sm">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <span class="font-black text-main text-sm sm:text-base box-element px-2.5 py-1 rounded-lg border-2 shrink-0">${item.noAntrian}</span>
                                    <span class="text-main font-extrabold truncate max-w-[110px] sm:max-w-[140px]">${item.nama} ${isMyNumber ? '<span class="font-black underline">(Anda)</span>' : ''}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-[10px] sm:text-xs uppercase tracking-wider border-2 ${badgeClass} font-black shrink-0">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
