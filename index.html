<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambil Antrean - Universal Queue</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Ambil Nomor Antrean</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan isi data diri Anda untuk mengambil nomor.</p>
        </div>

        <div id="formContainer">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: Budi Santoso">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nomor WhatsApp (Opsional)</label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-200">
                    Ambil Nomor Antrean
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses -->
        <div id="resultContainer" class="hidden text-center space-y-4">
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6">
                <p class="text-sm text-indigo-600 font-medium">Nomor Antrean Anda</p>
                <h2 id="displayNo" class="text-5xl font-extrabold text-indigo-900 my-2">A-001</h2>
                <p id="displayName" class="text-slate-600 font-medium"></p>
            </div>
            <div class="bg-slate-100 rounded-xl p-4 text-sm text-slate-600">
                <p>Sisa antrean di depan Anda: <span id="displayWaiting" class="font-bold text-slate-900">0</span> orang</p>
            </div>
            <button onclick="location.reload()" class="text-sm text-indigo-600 font-semibold hover:underline">
                Ambil Antrean Baru
            </button>
        </div>
    </div>

<script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = data.noAntrean;
                    document.getElementById("displayName").innerText = data.nama;
                    
                    // Langsung ambil data sisa antrean pertama kali
                    fetchStatusInfo(data.noAntrean);

                    // Set interval agar sisa antrean di HP customer ikut update live tiap 4 detik
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(() => {
                        fetchStatusInfo(data.noAntrean);
                    }, 4000);
                })
                .catch(err => {
                    alert("Terjadi kesalahan, silakan coba lagi.");
                    btn.disabled = false;
                    btn.innerText = "Ambil Nomor Antrean";
                });
        });

        function fetchStatusInfo(myQueueNo) {
            fetch(`${SCRIPT_URL}?action=getQueue`)
                .then(res => res.json())
                .then(data => {
                    // Hitung berapa orang yang statusnya "menunggu" dan berada di urutan sebelum nomor customer ini
                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    
                    // Cari posisi nomor customer dalam daftar menunggu
                    let myIndex = waitingList.findIndex(item => item.noAntrean === myQueueNo);
                    
                    let peopleAhead = 0;
                    if (myIndex !== -1) {
                        // Jika masih ada di daftar menunggu, orang di depannya adalah index-nya
                        peopleAhead = myIndex;
                    } else {
                        // Jika nomornya sudah tidak ada di list menunggu (artinya sedang dipanggil atau sudah selesai)
                        // Kita cek apakah sedang dipanggil
                        if (data.current && data.current.noAntrean === myQueueNo) {
                            peopleAhead = 0;
                            document.getElementById("displayWaiting").innerText = "Giliran Anda Sekarang!";
                            return;
                        } else {
                            peopleAhead = 0;
                        }
                    }

                    document.getElementById("displayWaiting").innerText = `${peopleAhead} orang`;
                });
        }
    </script>
</body>
</html>
