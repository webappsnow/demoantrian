<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Queue Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Tema Gelap: Latar hitam pekat, teks putih bersih */
        .dark body { background-color: #020617; color: #ffffff; }
        .dark .glass-card { background: #0f172a; border: 2px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        .dark .box-element { background: #1e293b; border-color: #475569; color: #ffffff; }
        
        /* Tema Terang: Latar putih bersih, box putih bersih, teks hitam legam */
        .light body { background-color: #f1f5f9; color: #000000; }
        .light .glass-card { background: #ffffff; border: 2px solid #cbd5e1; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15); }
        .light .box-element { background: #f8fafc; border-color: #cbd5e1; color: #000000; }

        .text-main { color: #000000; }
        .dark .text-main { color: #ffffff; }
        
        .text-muted { color: #334155; }
        .dark .text-muted { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center transition-colors duration-300">
    
    <div class="w-full max-w-sm glass-card rounded-[2.5rem] p-7 relative overflow-hidden transition-all">
        
        <!-- Tombol Ganti Tema -->
        <button onclick="toggleTheme()" class="absolute top-6 right-6 p-2.5 rounded-xl border-2 dark:border-slate-600 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 transition-all hover:scale-105 z-20 cursor-pointer shadow-sm" title="Ganti Tema">
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden dark:text-amber-400 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 dark:text-slate-200 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-main">Antrian Digital</h1>
            <p class="text-muted text-xs mt-1 font-extrabold">Enterprise Management System</p>
        </div>

        <!-- Jam & Tanggal -->
        <div class="mb-6 p-3.5 rounded-2xl box-element border-2 flex justify-between items-center text-xs font-black shadow-inner">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="realDate">--/--/----</span>
            </div>
            <div class="flex items-center space-x-1.5 font-mono">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="realClock">00:00:00</span>
            </div>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-muted mb-1.5">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3.5 rounded-xl border-2 box-element text-sm font-extrabold outline-none transition" placeholder="Contoh: Sarah Wijaya">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-muted mb-1.5">Nomor WhatsApp <span class="font-normal opacity-90">(Opsional)</span></label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3.5 rounded-xl border-2 box-element text-sm font-extrabold outline-none transition" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full mt-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-black py-4 rounded-xl text-sm hover:opacity-95 transition shadow-md cursor-pointer">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-4">
            <div class="text-center p-6 rounded-3xl border-2 box-element shadow-sm">
                <p class="text-[10px] font-black uppercase tracking-widest text-muted">Nomor Antrian Anda</p>
                <h2 id="displayNo" class="text-5xl font-black text-main my-2">-</h2>
                <p id="displayName" class="text-main font-black text-sm"></p>
            </div>
            
            <div class="flex justify-between items-center p-4 rounded-2xl border-2 box-element">
                <div class="text-left">
                    <p class="text-xs font-black uppercase tracking-wider text-muted">Sisa Antrian</p>
                    <p id="statusInfoText" class="text-xs text-main font-extrabold">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-2xl font-black text-main">0</span>
                    <span class="text-xs text-muted font-black ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Live Status -->
            <div class="box-element border-2 rounded-2xl p-3.5 shadow-sm">
                <p class="text-xs font-black uppercase tracking-wider text-muted mb-2.5 px-1">Live Status Antrian</p>
                <div class="max-h-40 overflow-y-auto space-y-2.5 pr-1" id="liveQueueList">
                    <!-- List dirender secara otomatis -->
                </div>
            </div>

            <div class="flex items-center justify-center space-x-2 pt-3 border-t-2 dark:border-slate-700 light:border-slate-300 text-xs font-bold text-muted text-center">
                <span>✓ Anda sudah terdaftar di dalam antrian.</span>
            </div>
        </div>
        
        <div class="text-center mt-6 text-[10px] font-black text-muted tracking-widest uppercase">
            Enterprise Queue Management
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;

        // Jam & Tanggal Real-Time
        function updateRealTimeClock() {
            const now = new Date();
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short' };
            const dateEl = document.getElementById("realDate");
            const clockEl = document.getElementById("realClock");
            if (dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', optionsDate);
            if (clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
        }
        setInterval(updateRealTimeClock, 1000);
        updateRealTimeClock();

        function toggleTheme() {
            const html = document.documentElement;
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                html.classList.add("light");
                localStorage.setItem("theme", "light");
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
        }

        // Muat tema awal
        (function() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const html = document.documentElement;
            if (savedTheme === "light") {
                html.classList.remove("dark");
                html.classList.add("light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
            }
        })();

        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (savedTheme === "light") {
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }

            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                alert("Anda sudah terdaftar di dalam antrian!");
                location.reload();
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                });
        });

        function appendInstantToList(qNo, qNama) {
            const listContainer = document.getElementById("liveQueueList");
            if (listContainer.innerHTML.includes("Belum ada antrian") || listContainer.innerHTML.trim() === "") {
                listContainer.innerHTML = "";
            }

            listContainer.innerHTML += `
                <div class="p-3 rounded-xl border-2 box-element flex justify-between items-center text-xs shadow-sm">
                    <div class="flex items-center space-x-2.5">
                        <span class="font-black text-main text-sm box-element px-2.5 py-0.5 rounded-md border-2">${qNo}</span>
                        <span class="text-main font-bold truncate max-w-[120px]">${qNama} <span class="font-black underline">(Anda)</span></span>
                    </div>
                    <span class="px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wider box-element text-main font-black border-2">Menunggu</span>
                </div>
            `;
            document.getElementById("displayWaiting").innerText = "0";
        }

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list) return;

                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; 

                    if (data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs text-muted text-center py-3 font-bold">Belum ada antrian</p>`;
                        return;
                    }

                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "SELESAI";
                        } else if (foundInList.status === "dipanggil") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "GILIRAN!";
                        } else {
                            if (myIndex !== -1) {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = myIndex;
                            }
                        }
                    }

                    data.list.forEach(item => {
                        let badgeClass = "box-element text-main";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeClass = "box-element text-main";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeClass = "dark:bg-white dark:text-slate-900 light:bg-slate-900 light:text-white font-black animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeClass = "box-element text-muted opacity-80";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-slate-900 dark:border-white shadow-md" : "box-element";

                        listContainer.innerHTML += `
                            <div class="p-3 rounded-xl border-2 ${cardHighlight} flex justify-between items-center text-xs transition-all shadow-sm">
                                <div class="flex items-center space-x-2.5">
                                    <span class="font-black text-main text-sm box-element px-2.5 py-0.5 rounded-md border-2">${item.noAntrian}</span>
                                    <span class="text-main font-bold truncate max-w-[120px]">${item.nama} ${isMyNumber ? '<span class="font-black underline">(Anda)</span>' : ''}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-md text-[10px] uppercase tracking-wider border-2 ${badgeClass} font-black">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
