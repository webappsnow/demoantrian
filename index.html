<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Digital Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Tema Gelap (Dark Mode) */
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .dark body {
            background-color: #020617;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(30, 41, 59, 0.5), rgba(2, 6, 23, 1));
            color: #f8fafc;
        }

        /* Tema Terang (Light Mode) */
        .light .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
        }
        .light body {
            background-color: #f8fafc;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(226, 232, 240, 0.8), rgba(248, 250, 252, 1));
            color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    
    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-7 sm:p-9 relative overflow-hidden">
        
        <!-- Tombol Ganti Tema (Dark / Light Toggle) -->
        <button onclick="toggleTheme()" class="absolute top-6 right-6 p-2.5 rounded-xl border transition-all dark:bg-slate-800/80 dark:border-slate-700 dark:text-amber-400 light:bg-slate-100 light:border-slate-200 light:text-slate-700 hover:scale-105 shadow-sm cursor-pointer" title="Ganti Tema">
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <!-- Widget Jam & Tanggal Real-time -->
        <div class="mb-6 pb-4 border-b dark:border-slate-800 light:border-slate-200 flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 dark:text-slate-400 light:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="realDate" class="dark:text-slate-300 light:text-slate-700 font-semibold">--/--/----</span>
            </div>
            <div class="flex items-center space-x-1.5 font-mono font-bold dark:text-indigo-400 light:text-indigo-600 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="realClock">00:00:00</span>
            </div>
        </div>

        <!-- Header Brand -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center p-3.5 dark:bg-slate-800/80 light:bg-slate-100 border dark:border-slate-700 light:border-slate-200 rounded-2xl mb-4 dark:text-indigo-400 light:text-indigo-600 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight dark:text-white light:text-slate-900">Antrian Digital</h1>
            <p class="dark:text-slate-400 light:text-slate-500 text-xs sm:text-sm mt-1.5 font-medium">Layanan mandiri pengambilan nomor antrian</p>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer" class="relative z-10">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider dark:text-slate-400 light:text-slate-600 mb-2">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3.5 dark:bg-slate-900/90 light:bg-slate-50 dark:border-slate-700/80 light:border-slate-200 border rounded-2xl dark:text-white light:text-slate-900 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition font-medium text-sm" placeholder="Contoh: Sarah Wijaya">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider dark:text-slate-400 light:text-slate-600 mb-2">Nomor WhatsApp <span class="text-slate-500 font-normal">(Opsional)</span></label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3.5 dark:bg-slate-900/90 light:bg-slate-50 dark:border-slate-700/80 light:border-slate-200 border rounded-2xl dark:text-white light:text-slate-900 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition font-medium text-sm" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98] text-sm tracking-wide">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-4 relative z-10">
            <div class="dark:bg-slate-900/90 light:bg-slate-50 border dark:border-slate-700/80 light:border-slate-200 rounded-3xl p-6 text-center relative overflow-hidden shadow-sm">
                <span class="inline-block px-3 py-1 dark:bg-slate-800 light:bg-white border dark:border-slate-700 light:border-slate-200 rounded-full text-[10px] font-extrabold tracking-widest uppercase dark:text-indigo-400 light:text-indigo-600 mb-2 shadow-xs">Nomor Antrian Anda</span>
                <h2 id="displayNo" class="text-5xl sm:text-6xl font-black dark:text-white light:text-slate-900 tracking-tight my-1">-</h2>
                <p id="displayName" class="dark:text-slate-300 light:text-slate-700 font-semibold text-sm mt-1"></p>
            </div>

            <div class="dark:bg-slate-900/60 light:bg-slate-50 border dark:border-slate-800 light:border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-xs">
                <div class="text-left">
                    <p class="text-[11px] font-bold dark:text-slate-400 light:text-slate-500 uppercase tracking-wider">Sisa Antrian Di Depan</p>
                    <p id="statusInfoText" class="text-xs font-semibold dark:text-indigo-400 light:text-indigo-600 mt-0.5">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-3xl font-black dark:text-white light:text-slate-900">0</span>
                    <span class="text-xs dark:text-slate-400 light:text-slate-500 font-medium ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Status Antrian Secara Live -->
            <div class="dark:bg-slate-900/80 light:bg-slate-50 border dark:border-slate-800/80 light:border-slate-200 rounded-2xl p-4 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <p class="text-[11px] font-bold uppercase tracking-wider dark:text-slate-400 light:text-slate-600">Live Status Antrian</p>
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>
                <div class="max-h-40 overflow-y-auto space-y-2 pr-1" id="liveQueueList">
                    <!-- List dirender secara otomatis -->
                </div>
            </div>

            <!-- Pesan Status Profesional & Rapi -->
            <div class="flex items-center justify-center space-x-2 p-3 dark:bg-slate-800/50 light:bg-slate-100 border dark:border-slate-700 light:border-slate-200 rounded-2xl dark:text-slate-400 light:text-slate-600 text-[11px] font-medium shadow-xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="truncate">Anda sudah terdaftar. Silakan lihat status antrian.</span>
            </div>
        </div>
        
        <div class="text-center mt-6 text-[11px] font-medium dark:text-slate-500 light:text-slate-400 tracking-wider uppercase">
            Enterprise Queue Management System
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;

        // Jam & Tanggal Real-Time
        function updateRealTimeClock() {
            const now = new Date();
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById("realDate").innerText = now.toLocaleDateString('id-ID', optionsDate);
            document.getElementById("realClock").innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateRealTimeClock, 1000);
        updateRealTimeClock();

        function toggleTheme() {
            const html = document.documentElement;
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                html.classList.add("light");
                localStorage.setItem("theme", "light");
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
        }

        (function() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const html = document.documentElement;
            if (savedTheme === "light") {
                html.classList.remove("dark");
                html.classList.add("light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
            }
        })();

        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (savedTheme === "light") {
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }

            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                alert("Anda sudah terdaftar di dalam antrian!");
                location.reload();
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                });
        });

        function appendInstantToList(qNo, qNama) {
            const listContainer = document.getElementById("liveQueueList");
            if (listContainer.innerHTML.includes("Belum ada antrian") || listContainer.innerHTML.trim() === "") {
                listContainer.innerHTML = "";
            }

            listContainer.innerHTML += `
                <div class="p-2.5 rounded-xl border dark:border-slate-700 light:border-slate-200 dark:bg-slate-800/50 light:bg-white flex justify-between items-center text-xs shadow-xs">
                    <div class="flex items-center space-x-2.5">
                        <span class="font-extrabold dark:text-white light:text-slate-900 text-sm dark:bg-slate-700 light:bg-slate-100 px-2 py-0.5 rounded-lg border dark:border-slate-600 light:border-slate-200">${qNo}</span>
                        <span class="dark:text-slate-200 light:text-slate-800 font-medium truncate max-w-[120px]">${qNama} <span class="dark:text-indigo-400 light:text-indigo-600 font-bold">(Anda)</span></span>
                    </div>
                    <span class="px-2 py-0.5 rounded-lg text-[10px] uppercase tracking-wider bg-amber-500/15 text-amber-500 border border-amber-500/30 font-bold">Menunggu</span>
                </div>
            `;
            document.getElementById("displayWaiting").innerText = "0";
        }

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list) return;

                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; 

                    if (data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs dark:text-slate-500 light:text-slate-400 text-center py-3 font-medium">Belum ada antrian</p>`;
                        return;
                    }

                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "SELESAI";
                        } else if (foundInList.status === "dipanggil") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "GILIRAN!";
                        } else {
                            if (myIndex !== -1) {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = myIndex;
                            }
                        }
                    }

                    data.list.forEach(item => {
                        let badgeColor = "dark:bg-slate-800 light:bg-slate-100 dark:text-slate-400 light:text-slate-600 dark:border-slate-700 light:border-slate-200";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeColor = "bg-amber-500/15 text-amber-500 border-amber-500/30";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeColor = "bg-blue-500/15 text-blue-500 border-blue-500/30 font-bold animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeColor = "bg-emerald-500/15 text-emerald-500 border-emerald-500/30";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-indigo-500/60 dark:bg-slate-800 light:bg-indigo-50/50 shadow-xs" : "dark:border-slate-800/80 light:border-slate-200 dark:bg-slate-900/40 light:bg-white";

                        listContainer.innerHTML += `
                            <div class="p-2.5 rounded-xl border ${cardHighlight} flex justify-between items-center text-xs transition-all">
                                <div class="flex items-center space-x-2.5">
                                    <span class="font-extrabold dark:text-white light:text-slate-900 text-sm dark:bg-slate-700 light:bg-slate-100 px-2 py-0.5 rounded-lg border dark:border-slate-600 light:border-slate-200">${item.noAntrian}</span>
                                    <span class="dark:text-slate-200 light:text-slate-800 font-medium truncate max-w-[120px]">${item.nama} ${isMyNumber ? '<span class="dark:text-indigo-400 light:text-indigo-600 font-bold">(Anda)</span>' : ''}</span>
                                </div>
                                <span class="px-2 py-0.5 rounded-lg text-[10px] uppercase tracking-wider border ${badgeColor} font-bold">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
