<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Digital Profesional</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-[#030712] bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.15),rgba(255,255,255,0))] text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">
    
    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-7 sm:p-9 relative overflow-hidden glow-effect">
        <!-- Dekorasi Cahaya Latar -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-violet-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header Brand -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center p-3.5 bg-gradient-to-tr from-indigo-500/20 to-violet-500/20 border border-indigo-500/30 rounded-2xl mb-4 text-indigo-400 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Antrian Digital</h1>
            <p class="text-slate-400 text-xs sm:text-sm mt-1.5 font-medium">Ambil nomor antrian Anda secara praktis & real-time</p>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer" class="relative z-10">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700/80 rounded-2xl text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition font-medium text-sm" placeholder="Contoh: Sarah Wijaya">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Nomor WhatsApp <span class="text-slate-600 font-normal">(Opsional)</span></label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3.5 bg-slate-900/80 border border-slate-700/80 rounded-2xl text-white placeholder-slate-600 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition font-medium text-sm" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full mt-2 bg-gradient-to-r from-indigo-500 via-indigo-600 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-indigo-500/25 active:scale-[0.98] text-sm tracking-wide">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-5 relative z-10">
            <div class="bg-gradient-to-b from-indigo-950/60 to-slate-900/80 border border-indigo-500/30 rounded-3xl p-6 text-center relative overflow-hidden shadow-inner">
                <div class="absolute -right-12 -top-12 w-36 h-36 bg-indigo-500/10 rounded-full blur-2xl"></div>
                <span class="inline-block px-3 py-1 bg-indigo-500/20 border border-indigo-500/30 rounded-full text-[10px] font-extrabold tracking-widest uppercase text-indigo-300 mb-2">Tiket Aktif Anda</span>
                <h2 id="displayNo" class="text-5xl sm:text-6xl font-black text-white tracking-tight my-1 drop-shadow-md">-</h2>
                <p id="displayName" class="text-slate-300 font-semibold text-sm mt-1"></p>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-sm">
                <div class="text-left">
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Sisa Antrian Di Depan</p>
                    <p id="statusInfoText" class="text-xs font-semibold text-indigo-400 mt-0.5">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-3xl font-black text-white">0</span>
                    <span class="text-xs text-slate-400 font-medium ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Status Antrian Secara Live -->
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Live Status Antrian</p>
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>
                <div class="max-h-44 overflow-y-auto space-y-2 pr-1 scrollbar-thin" id="liveQueueList">
                    <!-- List dirender secara otomatis oleh JavaScript -->
                </div>
            </div>

            <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-300 text-xs text-center font-medium leading-relaxed">
                Anda sudah terdaftar di dalam sistem. Silakan pantau status antrean Anda di atas.
            </div>
        </div>
        
        <div class="text-center mt-7 text-[11px] font-medium text-slate-500 tracking-wider uppercase">
            Powered by Universal Queue SaaS
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;

        window.addEventListener("DOMContentLoaded", () => {
            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                alert("Anda sudah terdaftar di dalam antrian!");
                location.reload();
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                });
        });

        function appendInstantToList(qNo, qNama) {
            const listContainer = document.getElementById("liveQueueList");
            if (listContainer.innerHTML.includes("Belum ada antrian") || listContainer.innerHTML.trim() === "") {
                listContainer.innerHTML = "";
            }

            listContainer.innerHTML += `
                <div class="p-3 rounded-xl border border-indigo-500/40 bg-indigo-950/40 flex justify-between items-center text-xs shadow-sm">
                    <div class="flex items-center space-x-2.5">
                        <span class="font-extrabold text-white text-sm bg-indigo-600/30 px-2 py-0.5 rounded-lg border border-indigo-500/30">${qNo}</span>
                        <span class="text-slate-200 font-medium truncate max-w-[130px]">${qNama} <span class="text-indigo-400 font-bold">(Anda)</span></span>
                    </div>
                    <span class="px-2.5 py-1 rounded-lg text-[10px] uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold">Menunggu</span>
                </div>
            `;
            document.getElementById("displayWaiting").innerText = "0";
        }

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list) return;

                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; 

                    if (data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-3 font-medium">Belum ada antrian</p>`;
                        return;
                    }

                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "SELESAI";
                        } else if (foundInList.status === "dipanggil") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "GILIRAN!";
                        } else {
                            if (myIndex !== -1) {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = myIndex;
                            }
                        }
                    }

                    data.list.forEach(item => {
                        let badgeColor = "bg-slate-800 text-slate-400 border-slate-700";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeColor = "bg-amber-500/15 text-amber-300 border-amber-500/30";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeColor = "bg-indigo-500/20 text-indigo-300 border-indigo-500/40 font-bold animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeColor = "bg-emerald-500/15 text-emerald-300 border-emerald-500/30";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-indigo-500/60 bg-indigo-950/50 shadow-md" : "border-slate-800/80 bg-slate-900/40";

                        listContainer.innerHTML += `
                            <div class="p-3 rounded-xl border ${cardHighlight} flex justify-between items-center text-xs transition-all">
                                <div class="flex items-center space-x-2.5">
                                    <span class="font-extrabold text-white text-sm bg-slate-800 px-2 py-0.5 rounded-lg border border-slate-700">${item.noAntrian}</span>
                                    <span class="text-slate-200 font-medium truncate max-w-[130px]">${item.nama} ${isMyNumber ? '<span class="text-indigo-400 font-bold">(Anda)</span>' : ''}</span>
                                </div>
                                <span class="px-2.5 py-1 rounded-lg text-[10px] uppercase tracking-wider border ${badgeColor} font-bold">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
