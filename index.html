<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Queue Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Palet Warna Mewah - Minimalis & Clean */
        .dark body { background-color: #020617; color: #f1f5f9; }
        .dark .glass-card { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        
        .light body { background-color: #f8fafc; color: #1e293b; }
        .light .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); }

        .text-main { color: #1e293b; }
        .dark .text-main { color: #f8fafc; }
        
        .text-muted { color: #64748b; }
        .dark .text-muted { color: #94a3b8; }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center transition-colors duration-300">
    
    <div class="w-full max-w-sm glass-card rounded-[2.5rem] p-7 relative overflow-hidden transition-all">
        
        <!-- Toggle Tema Minimalis -->
        <button onclick="toggleTheme()" class="absolute top-6 right-6 p-2 rounded-xl border dark:border-slate-800 light:border-slate-200 dark:bg-slate-900 light:bg-slate-50 transition-all hover:scale-105 z-20 cursor-pointer" title="Ganti Tema">
            <span id="themeLabel" class="text-[9px] font-bold tracking-widest uppercase opacity-70">Theme</span>
        </button>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-xl font-extrabold text-main">Antrian Digital</h1>
            <p class="text-muted text-xs mt-1 font-medium">Enterprise Management System</p>
        </div>

        <!-- Jam & Tanggal -->
        <div class="mb-6 p-3 rounded-2xl dark:bg-slate-900/50 light:bg-slate-50 border dark:border-slate-800 light:border-slate-200 flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-muted">
            <span id="realDate">--/--/----</span>
            <span id="realClock" class="font-mono text-main">00:00:00</span>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer">
            <form id="queueForm" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-muted mb-1.5">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3 rounded-xl border dark:bg-slate-900 light:bg-white dark:border-slate-700 light:border-slate-300 text-sm text-main focus:ring-2 focus:ring-slate-400 outline-none transition" placeholder="Contoh: Sarah Wijaya">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-muted mb-1.5">Nomor WhatsApp <span class="font-normal opacity-70">(Opsional)</span></label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3 rounded-xl border dark:bg-slate-900 light:bg-white dark:border-slate-700 light:border-slate-300 text-sm text-main focus:ring-2 focus:ring-slate-400 outline-none transition" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full mt-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold py-3.5 rounded-xl text-sm hover:opacity-90 transition shadow-md cursor-pointer">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-4">
            <div class="text-center p-6 rounded-3xl border dark:border-slate-800 light:border-slate-200 dark:bg-slate-900/50 light:bg-slate-50">
                <p class="text-[9px] font-bold uppercase tracking-widest opacity-50">Nomor Antrian Anda</p>
                <h2 id="displayNo" class="text-5xl font-black text-main my-2">-</h2>
                <p id="displayName" class="text-muted font-medium text-xs"></p>
            </div>
            
            <div class="flex justify-between items-center p-4 rounded-2xl border dark:border-slate-800 light:border-slate-200 dark:bg-slate-900/50 light:bg-slate-50">
                <div class="text-left">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-muted">Sisa Antrian</p>
                    <p id="statusInfoText" class="text-[10px] text-muted font-medium">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-xl font-black text-main">0</span>
                    <span class="text-xs text-muted ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Live Status -->
            <div class="dark:bg-slate-900/50 light:bg-slate-50 border dark:border-slate-800 light:border-slate-200 rounded-2xl p-3">
                <p class="text-[10px] font-bold uppercase tracking-wider text-muted mb-2 px-1">Live Status Antrian</p>
                <div class="max-h-40 overflow-y-auto space-y-2 pr-1" id="liveQueueList">
                    <!-- List dirender secara otomatis -->
                </div>
            </div>

            <div class="flex items-center justify-center space-x-2 pt-3 border-t dark:border-slate-800 light:border-slate-200 text-[10px] font-medium text-muted text-center">
                <span>✓ Anda sudah terdaftar di dalam antrian.</span>
            </div>
        </div>
        
        <div class="text-center mt-6 text-[10px] font-semibold text-muted tracking-wider uppercase opacity-75">
            Enterprise Queue Management
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;

        // Jam & Tanggal Real-Time
        function updateRealTimeClock() {
            const now = new Date();
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short' };
            const dateEl = document.getElementById("realDate");
            const clockEl = document.getElementById("realClock");
            if (dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', optionsDate);
            if (clockEl) clockEl.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
        }
        setInterval(updateRealTimeClock, 1000);
        updateRealTimeClock();

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                html.classList.add("light");
                localStorage.setItem("theme", "light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
            }
        }

        // Muat tema awal
        (function() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const html = document.documentElement;
            if (savedTheme === "light") {
                html.classList.remove("dark");
                html.classList.add("light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
            }
        })();

        window.addEventListener("DOMContentLoaded", () => {
            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                alert("Anda sudah terdaftar di dalam antrian!");
                location.reload();
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    appendInstantToList(myRegisteredQueueNo, nama);

                    setTimeout(fetchAllQueueStatus, 2000);
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                });
        });

        function appendInstantToList(qNo, qNama) {
            const listContainer = document.getElementById("liveQueueList");
            if (listContainer.innerHTML.includes("Belum ada antrian") || listContainer.innerHTML.trim() === "") {
                listContainer.innerHTML = "";
            }

            listContainer.innerHTML += `
                <div class="p-2.5 rounded-xl border dark:border-slate-800 light:border-slate-200 dark:bg-slate-900/60 light:bg-white flex justify-between items-center text-xs">
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-main text-xs dark:bg-slate-800 light:bg-slate-100 px-2 py-0.5 rounded-md border dark:border-slate-700 light:border-slate-200">${qNo}</span>
                        <span class="text-muted font-medium truncate max-w-[110px]">${qNama} <span class="text-main font-bold">(Anda)</span></span>
                    </div>
                    <span class="px-2 py-0.5 rounded-md text-[9px] uppercase tracking-wider dark:bg-slate-800 light:bg-slate-100 text-muted font-bold">Menunggu</span>
                </div>
            `;
            document.getElementById("displayWaiting").innerText = "0";
        }

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list) return;

                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; 

                    if (data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs text-muted text-center py-2 font-medium">Belum ada antrian</p>`;
                        return;
                    }

                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "SELESAI";
                        } else if (foundInList.status === "dipanggil") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "GILIRAN!";
                        } else {
                            if (myIndex !== -1) {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = myIndex;
                            }
                        }
                    }

                    data.list.forEach(item => {
                        let badgeClass = "dark:bg-slate-800 light:bg-slate-100 text-muted dark:border-slate-700 light:border-slate-200";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeClass = "dark:bg-slate-800 light:bg-slate-100 text-muted dark:border-slate-700 light:border-slate-200";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeClass = "dark:bg-white dark:text-slate-900 light:bg-slate-900 light:text-white font-bold animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeClass = "dark:bg-slate-800/50 light:bg-slate-100 text-muted opacity-60";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-slate-400 dark:border-slate-600 dark:bg-slate-800/40 light:bg-slate-100" : "dark:border-slate-800 light:border-slate-200 dark:bg-slate-900/30 light:bg-white";

                        listContainer.innerHTML += `
                            <div class="p-2.5 rounded-xl border ${cardHighlight} flex justify-between items-center text-xs transition-all">
                                <div class="flex items-center space-x-2">
                                    <span class="font-extrabold text-main text-xs dark:bg-slate-800 light:bg-slate-100 px-2 py-0.5 rounded-md border dark:border-slate-700 light:border-slate-200">${item.noAntrian}</span>
                                    <span class="text-muted font-medium truncate max-w-[110px]">${item.nama} ${isMyNumber ? '<span class="text-main font-bold">(Anda)</span>' : ''}</span>
                                </div>
                                <span class="px-2 py-0.5 rounded-md text-[9px] uppercase tracking-wider border ${badgeClass} font-semibold">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
