<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Digital</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-slate-900 to-slate-950 font-sans min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl p-6 md:p-8 text-white">
        <!-- Header Brand -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-indigo-500/20 border border-indigo-500/30 rounded-2xl mb-3 text-indigo-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">Sistem Antrian Digital</h1>
            <p class="text-slate-400 text-sm mt-1">Ambil nomor antrian Anda dari mana saja.</p>
        </div>

        <!-- Form Pendaftaran -->
        <div id="formContainer">
            <form id="queueForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Nama Lengkap</label>
                    <input type="text" id="nama" required class="w-full px-4 py-3.5 bg-slate-800/60 border border-slate-700 rounded-2xl text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="Contoh: Sarah Wijaya">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Nomor WhatsApp <span class="text-slate-500 font-normal">(Opsional)</span></label>
                    <input type="tel" id="telepon" class="w-full px-4 py-3.5 bg-slate-800/60 border border-slate-700 rounded-2xl text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="Contoh: 08123456789">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-indigo-500/25 active:scale-[0.98]">
                    Ambil Nomor Antrian
                </button>
            </form>
        </div>

        <!-- Kartu Hasil Sukses & Live Status -->
        <div id="resultContainer" class="hidden space-y-5">
            <div class="bg-indigo-950/60 border border-indigo-500/30 rounded-3xl p-6 text-center relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
                <p class="text-xs uppercase tracking-widest text-indigo-400 font-bold">Nomor Antrian Anda</p>
                <h2 id="displayNo" class="text-5xl font-black text-white tracking-wider my-2">-</h2>
                <p id="displayName" class="text-slate-300 font-medium"></p>
            </div>

            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between">
                <div class="text-left">
                    <p class="text-xs text-slate-400">Sisa Antrian di Depan</p>
                    <p id="statusInfoText" class="text-sm font-semibold text-indigo-300">Estimasi Real-time</p>
                </div>
                <div class="text-right">
                    <span id="displayWaiting" class="text-2xl font-black text-indigo-400">0</span>
                    <span class="text-xs text-slate-400 ml-1">orang</span>
                </div>
            </div>

            <!-- Daftar Status Antrian Secara Live -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Daftar Status Antrian Live</p>
                <div class="max-h-40 overflow-y-auto space-y-2 pr-1" id="liveQueueList">
                    <!-- List dirender secara otomatis oleh JavaScript -->
                </div>
            </div>

            <div class="p-3 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-300 text-xs text-center leading-relaxed">
                Anda sudah berada di dalam antrian. Silakan pantau daftar di atas.
            </div>
        </div>
        
        <div class="text-center mt-6 text-xs text-slate-500">
            Powered by Universal Queue SaaS System
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";
        let autoUpdateInterval = null;
        let myRegisteredQueueNo = localStorage.getItem("my_queue_number") || null;

        // Cek sesi lokal saat halaman dimuat
        window.addEventListener("DOMContentLoaded", () => {
            if (myRegisteredQueueNo) {
                document.getElementById("formContainer").classList.add("hidden");
                document.getElementById("resultContainer").classList.remove("hidden");
                document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                document.getElementById("displayName").innerText = localStorage.getItem("my_queue_name") || "Pelanggan";
                
                fetchAllQueueStatus();
                autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
            }
        });

        document.getElementById("queueForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            if (localStorage.getItem("my_queue_number")) {
                alert("Anda sudah terdaftar di dalam antrian!");
                location.reload();
                return;
            }

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const nama = document.getElementById("nama").value;
            const telepon = document.getElementById("telepon").value;

            // Ambil data untuk menentukan nomor urut antrian berikutnya secara presisi
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    let nextNum = 1;
                    if (data && data.list && data.list.length > 0) {
                        let maxNum = 0;
                        data.list.forEach(item => {
                            let parsed = parseInt(item.noAntrian.toString().replace(/\D/g, ''));
                            if (!isNaN(parsed) && parsed > maxNum) {
                                maxNum = parsed;
                            }
                        });
                        nextNum = maxNum + 1;
                    }

                    myRegisteredQueueNo = "A-" + ("000" + nextNum).slice(-3);

                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    // Kirim data pendaftaran ke Google Sheets di latar belakang
                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    fetchAllQueueStatus();
                    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                    autoUpdateInterval = setInterval(fetchAllQueueStatus, 4000);
                })
                .catch(() => {
                    myRegisteredQueueNo = "A-001";
                    localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                    localStorage.setItem("my_queue_name", nama);

                    document.getElementById("formContainer").classList.add("hidden");
                    document.getElementById("resultContainer").classList.remove("hidden");
                    document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                    document.getElementById("displayName").innerText = nama;

                    fetch(`${SCRIPT_URL}?action=register&nama=${encodeURIComponent(nama)}&telepon=${encodeURIComponent(telepon)}`, {
                        method: "GET",
                        mode: "no-cors"
                    });

                    fetchAllQueueStatus();
                });
        });

        function fetchAllQueueStatus() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    const listContainer = document.getElementById("liveQueueList");
                    listContainer.innerHTML = ""; // Bersihkan kontainer list

                    if (!data || !data.list || data.list.length === 0) {
                        listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">Belum ada antrian</p>`;
                        return;
                    }

                    // Sinkronisasi ulang nama jika sesi lokal berbeda
                    let savedName = localStorage.getItem("my_queue_name");
                    if (savedName && (!myRegisteredQueueNo || !data.list.some(item => item.noAntrian === myRegisteredQueueNo))) {
                        let matched = data.list.slice().reverse().find(item => item.nama && item.nama.trim().toLowerCase() === savedName.trim().toLowerCase());
                        if (matched) {
                            myRegisteredQueueNo = matched.noAntrian;
                            localStorage.setItem("my_queue_number", myRegisteredQueueNo);
                            document.getElementById("displayNo").innerText = myRegisteredQueueNo;
                        }
                    }

                    // Hitung sisa antrian di depan
                    let waitingList = data.list.filter(item => item.status === "menunggu");
                    let myIndex = waitingList.findIndex(item => item.noAntrian === myRegisteredQueueNo);
                    let foundInList = data.list.find(item => item.noAntrian === myRegisteredQueueNo);

                    if (foundInList) {
                        if (foundInList.status === "selesai") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "SELESAI";
                        } else if (foundInList.status === "dipanggil") {
                            document.getElementById("statusInfoText").innerText = "Status Anda:";
                            document.getElementById("displayWaiting").innerText = "GILIRAN!";
                        } else {
                            if (myIndex !== -1) {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = myIndex;
                            } else {
                                document.getElementById("statusInfoText").innerText = "Estimasi Real-time";
                                document.getElementById("displayWaiting").innerText = "0";
                            }
                        }
                    }

                    // Render daftar antrian ke layar
                    data.list.forEach(item => {
                        let badgeColor = "bg-slate-800 text-slate-400";
                        let statusText = item.status;

                        if (item.status === "menunggu") {
                            badgeColor = "bg-amber-500/20 text-amber-300 border border-amber-500/30";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeColor = "bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-bold";
                            statusText = "Dipanggil";
                        } else if (item.status === "selesai") {
                            badgeColor = "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                            statusText = "Selesai";
                        }

                        let isMyNumber = (item.noAntrian === myRegisteredQueueNo);
                        let cardHighlight = isMyNumber ? "border-indigo-500 bg-indigo-950/40" : "border-slate-800 bg-slate-900/50";

                        listContainer.innerHTML += `
                            <div class="p-2.5 rounded-xl border ${cardHighlight} flex justify-between items-center text-xs">
                                <div class="flex items-center space-x-2">
                                    <span class="font-extrabold text-white text-sm">${item.noAntrian}</span>
                                    <span class="text-slate-300 truncate max-w-[120px]">${item.nama} ${isMyNumber ? '(Anda)' : ''}</span>
                                </div>
                                <span class="px-2 py-0.5 rounded-md text-[10px] uppercase tracking-wider ${badgeColor}">${statusText}</span>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal menarik data:", err);
                });
        }
    </script>
</body>
</html>
