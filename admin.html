<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Enterprise Queue</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .dark body { background-color: #020617; color: #ffffff; }
        .dark .glass-card { background: #0f172a; border: 2px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
        .dark .box-element { background: #1e293b; border-color: #475569; color: #ffffff; }
        .dark .btn-theme { background-color: #ffffff; color: #000000; }
        
        .light body { background-color: #f1f5f9; color: #000000; }
        .light .glass-card { background: #ffffff; border: 2px solid #cbd5e1; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15); }
        .light .box-element { background: #ffffff; border-color: #cbd5e1; color: #000000; }
        .light .btn-theme { background-color: #000000; color: #ffffff; }

        .text-main { color: #000000; }
        .dark .text-main { color: #ffffff; }
        
        .text-muted { color: #334155; }
        .dark .text-muted { color: #cbd5e1; }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 flex items-center justify-center transition-colors duration-300">
    
    <div class="w-full max-w-4xl glass-card rounded-[2.5rem] p-6 sm:p-8 relative overflow-hidden transition-all space-y-6">
        
        <!-- Logo di Pojok Kiri Atas -->
        <img src="logo.png" alt="Logo" class="absolute top-6 left-6 w-11 h-11 rounded-xl shadow-sm border dark:border-slate-600 light:border-slate-300 object-cover z-20" onerror="this.style.display='none'">

        <!-- Tombol Ganti Tema di Pojok Kanan Atas -->
        <button onclick="toggleTheme()" class="absolute top-6 right-6 p-2.5 rounded-xl border-2 dark:border-slate-600 light:border-slate-300 dark:bg-slate-800 light:bg-slate-100 transition-all hover:scale-105 z-20 cursor-pointer shadow-sm" title="Ganti Tema">
            <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden dark:text-amber-400 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 dark:text-slate-200 light:text-slate-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>

        <!-- Header Panel -->
        <div class="text-center sm:text-left pt-2 sm:pl-14">
            <h2 class="text-lg font-black text-main tracking-tight">Klinik Sehat Utama</h2>
            <h1 class="text-2xl font-black text-main mt-1">Panel Admin</h1>
            <p class="text-muted text-xs sm:text-sm font-semibold mt-0.5">Kelola pemanggilan antrian secara real-time</p>
        </div>

        <!-- Indikator Sistem Aktif -->
        <div class="box-element border-2 rounded-2xl p-4 flex justify-between items-center shadow-inner">
            <span class="text-xs sm:text-sm font-black uppercase tracking-wider text-muted">Status Server</span>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="px-3 py-1 box-element border-2 text-emerald-500 text-xs font-black rounded-full uppercase tracking-wider">Sistem Aktif</span>
            </div>
        </div>

        <!-- Kontrol Utama -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Kartu Panggilan Aktif -->
            <div class="box-element border-2 rounded-3xl p-6 md:col-span-1 text-center flex flex-col justify-between shadow-sm">
                <div>
                    <p class="text-xs uppercase tracking-widest text-muted font-black">Sedang Dipanggil</p>
                    <h2 id="currentCall" class="text-4xl sm:text-5xl font-black text-main tracking-wider my-4 truncate px-1">-</h2>
                    <p id="currentName" class="text-xs sm:text-sm font-extrabold text-main px-1 leading-snug truncate">-</p>
                </div>
                <div class="mt-8 space-y-3">
                    <button id="btnNext" onclick="callNext()" class="w-full btn-theme font-black py-3.5 rounded-xl text-sm hover:opacity-95 transition shadow-md cursor-pointer">
                        Panggil Berikutnya
                    </button>
                    <button id="btnSkip" onclick="skipCurrent()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-xl text-xs transition cursor-pointer shadow-sm">
                        Lewati (Skip)
                    </button>
                    <button onclick="downloadExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs transition cursor-pointer shadow-sm flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span>Unduh Rekap Excel</span>
                    </button>
                    <button onclick="resetData()" class="w-full box-element border-2 text-main font-black py-3 rounded-xl text-xs transition cursor-pointer hover:opacity-80">
                        Reset Antrian Hari Ini
                    </button>
                </div>
            </div>

            <!-- Daftar Seluruh Antrian -->
            <div class="box-element border-2 rounded-3xl p-6 md:col-span-2 shadow-sm flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-black text-main text-xs sm:text-sm uppercase tracking-wider">Riwayat & Daftar Antrian</h3>
                    <span class="px-3 py-1 box-element border-2 text-main text-xs font-black rounded-xl whitespace-nowrap">
                        Total Pengunjung: <span id="totalCount">0</span> orang
                    </span>
                </div>
                
                <div class="overflow-x-auto max-h-72 overflow-y-auto pr-1">
                    <table class="w-full text-left text-xs sm:text-sm whitespace-nowrap">
                        <thead class="box-element border-b-2 text-muted sticky top-0 uppercase tracking-wider font-black">
                            <tr>
                                <th class="p-3.5">No</th>
                                <th class="p-3.5">Nama</th>
                                <th class="p-3.5">Waktu Daftar</th>
                                <th class="p-3.5">Status</th>
                            </tr>
                        </thead>
                        <tbody id="queueTableBody" class="divide-y-2 dark:divide-slate-700 light:divide-slate-200">
                            <tr>
                                <td colspan="4" class="text-center p-6 text-muted font-bold">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
        
        <div class="text-center text-xs font-black text-muted tracking-widest uppercase pt-2">
            Enterprise Queue Management - Admin Panel
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvuNf5jovuu7T1cBeRZBpI3iM0NQbULg-TWr08rpl0G3evd-Gdctmbj7mcEYqhwHbZHg/exec";

        function toggleTheme() {
            const html = document.documentElement;
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                html.classList.add("light");
                localStorage.setItem("theme", "light");
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
        }

        (function() {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const html = document.documentElement;
            if (savedTheme === "light") {
                html.classList.remove("dark");
                html.classList.add("light");
            } else {
                html.classList.remove("light");
                html.classList.add("dark");
            }
        })();

        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme") || "dark";
            const iconSun = document.getElementById("iconSun");
            const iconMoon = document.getElementById("iconMoon");

            if (savedTheme === "light") {
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
            loadQueue();
        });

        function formatWaktuAman(rawWaktu) {
            if (!rawWaktu) return "-";
            let strWaktu = rawWaktu.toString();
            if (strWaktu.includes("1899") || strWaktu.includes("T")) {
                let d = new Date(rawWaktu);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleTimeString('id-ID', { hour12: false });
                }
            }
            return strWaktu;
        }

        function loadQueue() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data) return;

                    if (data.current) {
                        document.getElementById("currentCall").innerText = data.current.noAntrian;
                        document.getElementById("currentName").innerText = data.current.nama;
                    } else {
                        document.getElementById("currentCall").innerText = "-";
                        document.getElementById("currentName").innerText = "Tidak ada panggilan aktif";
                    }

                    const allList = data.list || [];
                    document.getElementById("totalCount").innerText = allList.length;

                    const tbody = document.getElementById("queueTableBody");
                    tbody.innerHTML = "";
                    
                    if (allList.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-6 text-muted font-bold">Belum ada antrian terdaftar</td></tr>`;
                        return;
                    }

                    allList.forEach(item => {
                        let waktuBersih = formatWaktuAman(item.waktu);
                        let badgeStyle = "box-element text-main";
                        let statusText = item.status;
                        let actionButton = "";

                        if (item.status === "menunggu") {
                            badgeStyle = "box-element text-main";
                            statusText = "Menunggu";
                        } else if (item.status === "dipanggil") {
                            badgeStyle = "dark:bg-white dark:text-slate-900 light:bg-slate-900 light:text-white font-black animate-pulse";
                            statusText = "Dipanggil";
                        } else if (item.status === "dilewati") {
                            badgeStyle = "bg-amber-500/20 text-amber-500 border-amber-500/30";
                            statusText = "Dilewati";
                            actionButton = `<button onclick="callSpecific('${item.noAntrian}')" class="ml-2 px-2 py-0.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded font-bold text-[10px] cursor-pointer">Panggil</button>`;
                        } else if (item.status === "selesai") {
                            badgeStyle = "box-element text-muted opacity-80";
                            statusText = "Selesai";
                        }

                        tbody.innerHTML += `
                            <tr class="transition">
                                <td class="p-3.5 font-black text-main text-sm sm:text-base">${item.noAntrian}</td>
                                <td class="p-3.5 text-main font-extrabold max-w-[150px] truncate">${item.nama}</td>
                                <td class="p-3.5 text-muted font-bold font-mono">${waktuBersih}</td>
                                <td class="p-3.5">
                                    <div class="flex items-center space-x-1">
                                        <span class="px-2.5 py-1 border-2 text-[10px] sm:text-xs uppercase tracking-wider rounded-lg font-black ${badgeStyle}">${statusText}</span>
                                        ${actionButton}
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Gagal memuat antrian:", err);
                });
        }

        function callNext() {
            const btn = document.getElementById("btnNext");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            fetch(`${SCRIPT_URL}?action=next&loket=Loket 1`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    btn.disabled = false;
                    btn.innerText = "Panggil Berikutnya";
                    loadQueue();
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerText = "Panggil Berikutnya";
                    loadQueue();
                });
        }

        function skipCurrent() {
            const btn = document.getElementById("btnSkip");
            btn.disabled = true;
            btn.innerText = "Melewati...";

            fetch(`${SCRIPT_URL}?action=skip&loket=Loket 1`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    btn.disabled = false;
                    btn.innerText = "Lewati (Skip)";
                    loadQueue();
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerText = "Lewati (Skip)";
                    loadQueue();
                });
        }

        function callSpecific(noAntrian) {
            fetch(`${SCRIPT_URL}?action=callSpecific&no=${noAntrian}&loket=Loket 1`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    loadQueue();
                })
                .catch(err => {
                    console.error("Gagal memanggil ulang:", err);
                });
        }

        function downloadExcel() {
            fetch(`${SCRIPT_URL}?action=getQueue`, { method: "GET", redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.list || data.list.length === 0) {
                        alert("Tidak ada data pengunjung untuk diunduh hari ini.");
                        return;
                    }

                    let csvContent = "\uFEFFNo Antrian,Nama,Telepon,Status,Waktu,Loket\n";

                    data.list.forEach(item => {
                        let waktuBersih = formatWaktuAman(item.waktu);
                        let rowData = [
                            `"${item.noAntrian || ''}"`,
                            `"${item.nama || ''}"`,
                            `"${item.telepon || '-'}"`,
                            `"${item.status || ''}"`,
                            `"${waktuBersih}"`,
                            `"${item.loket || '-'}"`
                        ];
                        csvContent += rowData.join(",") + "\n";
                    });

                    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    let url = URL.createObjectURL(blob);
                    let a = document.createElement('a');
                    a.setAttribute('href', url);
                    
                    let todayStr = new Date().toISOString().slice(0, 10);
                    a.setAttribute('download', `Rekap_Antrian_${todayStr}.csv`);
                    
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                })
                .catch(err => {
                    console.error("Gagal mengunduh data:", err);
                    alert("Gagal mengunduh rekap data.");
                });
        }

        function resetData() {
            if (confirm("Yakin ingin mereset seluruh antrian hari ini? Data di Google Sheets akan dikosongkan.")) {
                fetch(`${SCRIPT_URL}?action=reset`, { method: "GET", redirect: "follow" })
                    .then(res => res.json())
                    .then(data => {
                        alert("Antrian berhasil direset!");
                        loadQueue();
                    });
            }
        }

        // Auto Refresh tiap 4 detik
        setInterval(loadQueue, 4000);
        loadQueue();
    </script>
</body>
</html>
